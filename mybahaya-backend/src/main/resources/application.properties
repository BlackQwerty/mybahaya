spring.application.name=mybahaya-backend
server.port=8080
server.address=0.0.0.0
# Deactivate local docker engine checks since infrastructure is live on Hetzner
spring.docker.compose.enabled=false

# Firebase service account key file path (set this as an environment variable)
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# Allow image + video uploads up to 200MB (default is only 1MB).
# Gallery videos can be much larger than a 15s recording.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

#MinIO Configurations
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access.key=${MINIO_ROOT_USER}
minio.secret.key=${MINIO_ROOT_PASSWORD}

minio.bucket.evidence=evidence
minio.bucket.profiles=profiles
minio.bucket.reports=reports
minio.bucket.system=system

# Gemini AI (loaded from .env via springboot3-dotenv)
gemini.api.key=${Gemini_Api_Key}


