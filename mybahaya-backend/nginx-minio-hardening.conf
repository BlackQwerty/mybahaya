# ============================================================
# nginx-minio-hardening.conf — REFERENCE
#
# Replace your existing  location /minio/  block (inside the
# api.mybahaya.com server { } block) with this hardened version.
#
# Find your live config with:
#   grep -rl "api.mybahaya.com" /etc/nginx/
# Usually: /etc/nginx/sites-available/api.mybahaya.com  (or default)
#
# After editing:  nginx -t  &&  systemctl reload nginx
# ============================================================

server {
    server_name api.mybahaya.com;

    # Allow large video uploads to the backend (default nginx limit is 1MB!)
    client_max_body_size 200M;

    # ── Backend API ────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # long enough for big video uploads
    }

    # ── MinIO media (HARDENED) ─────────────────────────────
    # Only read-only object fetches from the PUBLIC media buckets are allowed.
    # The MinIO admin API, console, and bucket-listing are NOT exposed.
    location ~ ^/minio/(reports|profiles|evidence)/[^/]+$ {
        # Block everything except read methods
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;

        # Strip the /minio prefix so MinIO sees /reports/<file>
        rewrite ^/minio/(.*)$ /$1 break;

        # Don't let clients reach MinIO's admin/console paths
        # (anything not matching the regex above returns 404 below)
    }

    # Any other /minio/* path (console, S3 admin API, bucket list) → blocked
    location /minio/ {
        return 404;
    }

    listen 443 ssl;
    # ssl_certificate / ssl_certificate_key lines stay as they already are
}
