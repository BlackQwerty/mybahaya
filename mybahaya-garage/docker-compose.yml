services:

  garage:
    image: dxflrs/garage:v1.1.0

    container_name: garage

    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"

    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./garage-data:/var/lib/garage/data
      - ./garage-meta:/var/lib/garage/meta

    command: garage server

    restart: unless-stopped