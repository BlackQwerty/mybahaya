<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBahaya — Sign In</title>

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body class="login-body">

  <!-- Animated mesh background -->
  <div class="login-bg" aria-hidden="true">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <main class="login-wrapper">

    <!-- Brand -->
    <div class="login-brand fade-in">
      <img src="assets/logo_icon/officialMyBahayaIcon.png" alt="MyBahaya" class="login-logo" />
      <h1 class="login-app-name">MyBahaya</h1>
      <p class="login-tagline">Emergency Response Management System</p>
    </div>

    <!-- Card -->
    <div class="glass-card login-card fade-in fade-in-delay-1">

      <div class="login-header">
        <h2 class="login-title">Sign In</h2>
        <p class="login-subtitle">Admin &amp; Organization Access Only</p>
      </div>

      <!-- Error banner -->
      <div class="login-error hidden" id="login-error" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span id="login-error-msg">Invalid credentials.</span>
      </div>

      <form class="login-form" id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-wrap">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              class="glass-input login-input"
              id="login-email"
              type="email"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="input-wrap">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              class="glass-input login-input"
              id="login-password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password visibility">
              <ion-icon name="eye-outline" id="pw-eye-icon"></ion-icon>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary login-btn" id="login-btn">
          <span id="login-btn-text">Sign In</span>
          <span class="login-spinner hidden" id="login-spinner"></span>
          <ion-icon name="arrow-forward-outline" id="login-arrow"></ion-icon>
        </button>

      </form>

      <p class="login-footer-note">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        Authorised personnel only. Unauthorized access is prohibited.
      </p>

    </div>

    <p class="login-version">MyBahaya Admin v1.0 &nbsp;·&nbsp; Alor Gajah, Melaka</p>

  </main>

  <script>
    'use strict';

    // If already signed in, redirect to home
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) window.location.replace('home.html');
    });

    const form        = document.getElementById('login-form');
    const emailInput  = document.getElementById('login-email');
    const pwInput     = document.getElementById('login-password');
    const errorBanner = document.getElementById('login-error');
    const errorMsg    = document.getElementById('login-error-msg');
    const loginBtn    = document.getElementById('login-btn');
    const btnText     = document.getElementById('login-btn-text');
    const spinner     = document.getElementById('login-spinner');
    const arrow       = document.getElementById('login-arrow');
    const togglePw    = document.getElementById('toggle-pw');
    const pwEyeIcon   = document.getElementById('pw-eye-icon');

    // Toggle password visibility
    togglePw.addEventListener('click', function () {
      const isHidden = pwInput.type === 'password';
      pwInput.type   = isHidden ? 'text' : 'password';
      pwEyeIcon.setAttribute('name', isHidden ? 'eye-off-outline' : 'eye-outline');
    });

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.textContent = loading ? 'Signing in…' : 'Sign In';
      spinner.classList.toggle('hidden', !loading);
      arrow.classList.toggle('hidden', loading);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBanner.classList.add('hidden');

      const email    = emailInput.value.trim();
      const password = pwInput.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      setLoading(true);

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function () {
          window.location.replace('home.html');
        })
        .catch(function (err) {
          setLoading(false);
          const messages = {
            'auth/user-not-found':    'No account found with this email.',
            'auth/wrong-password':    'Incorrect password. Please try again.',
            'auth/invalid-email':     'Invalid email address format.',
            'auth/too-many-requests': 'Too many failed attempts. Try again later.',
            'auth/invalid-credential':'Invalid email or password.',
          };
          showError(messages[err.code] || 'Sign-in failed. Please try again.');
        });
    });
  </script>

</body>
</html>
