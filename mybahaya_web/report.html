<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBahaya - Reports</title>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/report.css" />
</head>

<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="home.html" class="navbar-brand" aria-label="MyBahaya Home">
      <div class="brand-icon"><img src="assets/logo_icon/officialMyBahayaIcon.png" alt="MyBahaya" class="brand-logo" />
      </div>
      <span class="brand-name">MyBahaya</span>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="home.html"><ion-icon name="home-outline"></ion-icon> Home</a></li>
      <li><a href="report.html" class="active"><ion-icon name="document-text-outline"></ion-icon> Reports</a></li>
      <li><a href="map.html"><ion-icon name="map-outline"></ion-icon> Map</a></li>
      <li><a href="analytics.html"><ion-icon name="bar-chart-outline"></ion-icon> Analytics</a></li>
      <li><a href="organizations.html" class="admin-only"><ion-icon name="people-outline"></ion-icon> Organizations</a>
      </li>
    </ul>
    <div class="navbar-right">
      <div class="avatar-btn" role="button" aria-label="User profile" tabindex="0">
        <ion-icon name="person-circle-outline"></ion-icon>
      </div>
    </div>
  </nav>

  <main class="page-wrapper" id="main-content">
    <div class="reports-container">

      <!-- Page Header -->
      <div class="page-header fade-in">
        <div>
          <h1 class="page-title">Reports Centre</h1>
          <p class="page-sub">All incidents from across Malaysia. Real time from Firestore.</p>
        </div>
        <div class="header-meta">
          <span class="total-badge" id="total-count-badge">Loading…</span>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="glass-card filter-bar fade-in fade-in-delay-1">

        <!-- Search -->
        <div class="filter-search">
          <ion-icon name="search-outline" class="search-icon"></ion-icon>
          <input type="search" class="glass-input search-input" id="report-search"
            placeholder="Search category, description…" aria-label="Search reports" />
        </div>

        <!-- Layer 1 : Geographic scope -->
        <div class="filter-layer">
          <span class="filter-layer-label">
            <ion-icon name="location-outline"></ion-icon> Scope
          </span>
          <div class="filter-chips" role="group" aria-label="Geographic scope">
            <button class="chip active" data-scope="malaysia">🇲🇾 Malaysia</button>
            <button class="chip" data-scope="state">By State</button>
          </div>
          <select class="glass-input state-select hidden" id="state-select" aria-label="Select state">
            <option value="">Select state</option>
            <option>Perlis</option>
            <option>Kedah</option>
            <option>Pulau Pinang</option>
            <option>Perak</option>
            <option>Selangor</option>
            <option>Kuala Lumpur</option>
            <option>Putrajaya</option>
            <option>Negeri Sembilan</option>
            <option>Melaka</option>
            <option>Johor</option>
            <option>Pahang</option>
            <option>Terengganu</option>
            <option>Kelantan</option>
            <option>Sabah</option>
            <option>Sarawak</option>
            <option>Labuan</option>
          </select>
        </div>

        <!-- Layer 2 : Category -->
        <div class="filter-layer">
          <span class="filter-layer-label">
            <ion-icon name="grid-outline"></ion-icon> Category
          </span>
          <div class="filter-chips" role="group" aria-label="Filter by category">
            <button class="chip active" data-cat="all">All</button>
            <button class="chip chip-theft" data-cat="Theft">Theft</button>
            <button class="chip chip-assault" data-cat="Assault">Assault</button>
            <button class="chip chip-fire" data-cat="Fire">Fire</button>
            <button class="chip chip-medical" data-cat="Medical">Medical</button>
            <button class="chip chip-other" data-cat="Other">Other</button>
          </div>
        </div>

        <!-- Sort -->
        <div class="filter-sort">
          <select class="glass-input sort-select" id="report-sort" aria-label="Sort reports">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>

      </div>

      <!-- Loading state -->
      <div id="reports-loading" class="loading-row">
        <div class="loading-spinner"></div>
        <span>Loading reports from Firestore…</span>
      </div>

      <!-- Reports Grid -->
      <div class="reports-grid" id="reports-grid" role="list" aria-label="Incident reports"></div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="empty-state">
        <div class="glass-icon" style="font-size:36px;padding:18px;border-radius:18px">
          <ion-icon name="search-outline"></ion-icon>
        </div>
        <p>No reports match your filters</p>
        <button class="btn btn-glass" id="btn-clear-filter">Clear Filters</button>
      </div>

    </div>
  </main>

  <!-- FAB -->
  <div class="fab-container">
    <div class="fab-menu" id="fab-menu" role="menu">
      <a href="#" class="fab-menu-item" id="fab-settings" role="menuitem">
        <ion-icon name="settings-outline"></ion-icon> Settings
      </a>
      <button class="fab-menu-item danger" id="fab-logout" role="menuitem">
        <ion-icon name="log-out-outline"></ion-icon> Log Out
      </button>
    </div>
    <button class="fab-btn" id="fab-btn" aria-label="Open menu" aria-expanded="false">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/report.js"></script>
</body>

</html>
