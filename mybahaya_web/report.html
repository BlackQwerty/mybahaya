<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBahaya — Reports</title>
  <meta name="description" content="View, filter and manage all incident reports submitted to MyBahaya." />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/report.css" />
</head>

<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="home.html" class="navbar-brand" aria-label="MyBahaya Home">
      <div class="brand-icon"><i class="ph ph-shield-warning"></i></div>
      <span class="brand-name">MyBahaya</span>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="home.html"><i class="ph ph-house"></i> Home</a></li>
      <li><a href="report.html" class="active"><i class="ph ph-clipboard-text"></i> Reports</a></li>
      <li><a href="map.html"><i class="ph ph-map-trifold"></i> Map</a></li>
      <li><a href="analytics.html"><i class="ph ph-chart-line-up"></i> Analytics</a></li>
      <li><a href="users.html" class="admin-only"><i class="ph ph-users-three"></i> Users</a></li>
    </ul>
    <div class="navbar-right">
      <div class="avatar-btn" role="button" aria-label="User profile" tabindex="0">
        <i class="ph ph-user-circle"></i>
      </div>
    </div>
  </nav>

  <main class="page-wrapper" id="main-content">
    <div class="reports-container">

      <!-- Page Header -->
      <div class="page-header fade-in">
        <div>
          <p class="page-eyebrow"><span class="dot"></span> Incident Reports</p>
          <h1 class="page-title">Reports <span class="gradient-text">Centre</span></h1>
          <p class="page-sub">All submitted incidents — searchable, filterable, and actionable</p>
        </div>
        <button class="btn btn-primary" id="btn-new-report" aria-label="Submit new report">
          <i class="ph ph-plus"></i> New Report
        </button>
      </div>

      <!-- Filter Bar -->
      <div class="glass-card filter-bar fade-in fade-in-delay-1">
        <div class="filter-search">
          <i class="ph ph-magnifying-glass search-icon"></i>
          <input type="search" class="glass-input search-input" id="report-search"
            placeholder="Search reports, locations, IDs…" aria-label="Search reports" />
        </div>
        <div class="filter-chips" role="group" aria-label="Filter by severity">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip chip-critical" data-filter="critical">Critical</button>
          <button class="chip chip-warning" data-filter="warning">Warning</button>
          <button class="chip chip-success" data-filter="resolved">Resolved</button>
          <button class="chip chip-info" data-filter="pending">Pending</button>
        </div>
        <div class="filter-sort">
          <select class="glass-input sort-select" id="report-sort" aria-label="Sort reports">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="severity">By Severity</option>
          </select>
        </div>
      </div>

      <!-- Reports Grid -->
      <div class="reports-grid" id="reports-grid" role="list" aria-label="Incident reports"></div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="empty-state">
        <div class="glass-icon" style="font-size:40px;padding:20px;border-radius:20px">
          <i class="ph ph-magnifying-glass"></i>
        </div>
        <p>No reports match your filters</p>
        <button class="btn btn-glass" id="btn-clear-filter">Clear Filters</button>
      </div>

    </div>
  </main>

  <!-- New Report Modal -->
  <div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box glass-card">
      <div class="modal-header">
        <h2 class="section-title" id="modal-title"><span class="dot"></span> New Incident Report</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">
          <i class="ph ph-x"></i>
        </button>
      </div>
      <form class="report-form" id="report-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="f-type">Incident Type</label>
          <select class="glass-input" id="f-type" required>
            <option value="">Select type…</option>
            <option>Armed Threat</option>
            <option>Fire</option>
            <option>Medical Emergency</option>
            <option>Crowd Disturbance</option>
            <option>Theft / Robbery</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-location">Location</label>
          <input class="glass-input" id="f-location" type="text" placeholder="e.g. Jalan Bukit Seguntang" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-severity">Severity</label>
            <select class="glass-input" id="f-severity" required>
              <option value="">Select…</option>
              <option value="critical">Critical</option>
              <option value="warning">Warning</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-status">Status</label>
            <select class="glass-input" id="f-status">
              <option value="pending">Pending</option>
              <option value="active">Active</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-details">Description</label>
          <textarea class="glass-input" id="f-details" rows="3"
            placeholder="Describe the incident in detail…"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-glass" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Report <i class="ph ph-paper-plane-tilt"></i></button>
        </div>
      </form>
    </div>
  </div>

  <!-- FAB -->
  <div class="fab-container">
    <div class="fab-menu" id="fab-menu" role="menu">
      <a href="#" class="fab-menu-item" id="fab-settings" role="menuitem">
        <i class="ph ph-gear"></i> Settings
      </a>
      <button class="fab-menu-item danger" id="fab-logout" role="menuitem">
        <i class="ph ph-sign-out"></i> Log Out
      </button>
    </div>
    <button class="fab-btn" id="fab-btn" aria-label="Open menu" aria-expanded="false">
      <i class="ph ph-list"></i>
    </button>
  </div>

  <script src="../js/shared.js"></script>
  <script src="../js/report.js"></script>
</body>

</html>
