<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBahaya - Live Map</title>
  <meta name="description" content="Live map interface for tracking and monitoring incidents." />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <!-- MapLibre -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>

<body class="map-page">
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="home.html" class="navbar-brand" aria-label="MyBahaya Home">
      <div class="brand-icon"><img src="assets/logo_icon/officialMyBahayaIcon.png" alt="MyBahaya" class="brand-logo" /></div>
      <span class="brand-name">MyBahaya</span>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="home.html"><ion-icon name="home-outline"></ion-icon> Home</a></li>
      <li><a href="report.html"><ion-icon name="document-text-outline"></ion-icon> Reports</a></li>
      <li><a href="map.html" class="active"><ion-icon name="map-outline"></ion-icon> Map</a></li>
      <li><a href="analytics.html"><ion-icon name="bar-chart-outline"></ion-icon> Analytics</a></li>
      <li><a href="organizations.html" class="admin-only"><ion-icon name="people-outline"></ion-icon> Organizations</a></li>
    </ul>
    <div class="navbar-right">
      <div class="settings-menu-wrap"><button class="avatar-btn settings-btn" id="settings-btn" aria-label="Open settings" aria-expanded="false" aria-controls="settings-menu"><ion-icon name="settings-outline"></ion-icon></button><div class="settings-menu" id="settings-menu" role="menu"><a href="#" class="settings-account" role="menuitem"><ion-icon name="person-outline"></ion-icon> Account</a><button type="button" class="settings-logout" role="menuitem"><ion-icon name="log-out-outline"></ion-icon> Log Out</button></div></div>
    </div>
  </nav>

  <!-- Fullscreen Map Container -->
  <div id="full-map" class="full-map-container"></div>
  <!-- Overlay tint for glass effect over map -->
  <div class="map-overlay-tint"></div>

  <!-- Interactive Overlays -->
  <div class="map-ui fade-in">

    <!-- Left Panel: Legend + Filter -->
    <div class="map-left-panels">
      <div class="glass-card map-panel">
        <h3 class="panel-title">Legend &amp; Filter</h3>
        <div class="legend-list" id="legend-list">

          <div class="legend-item active" data-cat="all">
            <div class="legend-all-dot"></div>
            <span class="legend-label">All Reports</span>
            <span class="legend-count" id="count-all">0</span>
          </div>

          <div class="legend-item" data-cat="Theft">
            <div class="cat-pin cat-pin-Theft legend-cat-icon"><ion-icon name="lock-open-outline"></ion-icon></div>
            <span class="legend-label">Theft</span>
            <span class="legend-count" id="count-Theft">0</span>
          </div>

          <div class="legend-item" data-cat="Assault">
            <div class="cat-pin cat-pin-Assault legend-cat-icon"><ion-icon name="alert-circle-outline"></ion-icon></div>
            <span class="legend-label">Assault</span>
            <span class="legend-count" id="count-Assault">0</span>
          </div>

          <div class="legend-item" data-cat="Fire">
            <div class="cat-pin cat-pin-Fire legend-cat-icon"><ion-icon name="flame-outline"></ion-icon></div>
            <span class="legend-label">Fire</span>
            <span class="legend-count" id="count-Fire">0</span>
          </div>

          <div class="legend-item" data-cat="Medical">
            <div class="cat-pin cat-pin-Medical legend-cat-icon"><ion-icon name="medkit-outline"></ion-icon></div>
            <span class="legend-label">Medical</span>
            <span class="legend-count" id="count-Medical">0</span>
          </div>

          <div class="legend-item" data-cat="Other">
            <div class="cat-pin cat-pin-Other legend-cat-icon"><ion-icon name="help-circle-outline"></ion-icon></div>
            <span class="legend-label">Other</span>
            <span class="legend-count" id="count-Other">0</span>
          </div>

        </div>
      </div>
    </div>

    <!-- Right Panel: Live Stats -->
    <div class="map-right-panels">
      <div class="glass-card map-panel" style="width:240px;">
        <h3 class="panel-title">Live Reports</h3>

        <div class="stats-total-row">
          <span class="stats-total-num" id="stats-total">0</span>
          <span class="stats-total-label">total reports</span>
        </div>

        <div id="stats-cats" class="stats-cats"></div>

        <hr class="panel-divider">

        <h3 class="panel-title" style="margin-bottom:10px">Recent Activity</h3>
        <div class="map-activity-list" id="recent-activity">
          <p class="no-data-text">Loading…</p>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="map-bottom-controls">
      <div class="zoom-controls glass-card">
        <button id="zoom-in"><ion-icon name="add-outline"></ion-icon></button>
        <button id="zoom-out"><ion-icon name="remove-outline"></ion-icon></button>
      </div>
      <button class="btn btn-glass icon-btn" id="locate-me"><ion-icon name="locate-outline"></ion-icon></button>
    </div>

  </div>


  <!-- Map loading badge -->
  <div id="map-loading" class="map-loading-badge hidden">
    <div class="map-loading-dot"></div>
    <span class="map-loading-label">Loading reports…</span>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/map.js"></script>
</body>

</html>
