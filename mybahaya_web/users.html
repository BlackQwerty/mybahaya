<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBahaya — User Management</title>
  <meta name="description" content="Admin interface for managing users and roles." />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/users.css" />
</head>

<body>
  <div class="mesh-bg" aria-hidden="true"></div>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="home.html" class="navbar-brand" aria-label="MyBahaya Home">
      <div class="brand-icon"><i class="ph ph-shield-warning"></i></div>
      <span class="brand-name">MyBahaya</span>
    </a>
    <ul class="nav-links" role="list">
      <li><a href="home.html"><i class="ph ph-house"></i> Home</a></li>
      <li><a href="report.html"><i class="ph ph-clipboard-text"></i> Reports</a></li>
      <li><a href="map.html"><i class="ph ph-map-trifold"></i> Map</a></li>
      <li><a href="analytics.html"><i class="ph ph-chart-line-up"></i> Analytics</a></li>
      <li><a href="users.html" class="active admin-only"><i class="ph ph-users-three"></i> Users</a></li>
    </ul>
    <div class="navbar-right">
      <div class="avatar-btn" role="button" aria-label="User profile" tabindex="0">
        <i class="ph ph-user-circle"></i>
      </div>
    </div>
  </nav>

  <main class="page-wrapper" id="main-content">
    <div class="users-container">

      <!-- Header -->
      <div class="page-header fade-in">
        <div>
          <p class="page-eyebrow"><span class="dot"
              style="background:var(--accent-secondary);box-shadow:0 0 8px var(--accent-secondary)"></span> Admin Only</p>
          <h1 class="page-title">User <span class="gradient-text">Management</span></h1>
          <p class="page-sub">Manage system access, roles, and user profiles</p>
        </div>
        <button class="btn btn-primary" id="btn-add-user" aria-label="Add new user">
          <i class="ph ph-user-plus"></i> Add User
        </button>
      </div>

      <!-- Action Bar -->
      <div class="glass-card action-bar fade-in fade-in-delay-1">
        <div class="filter-search">
          <i class="ph ph-magnifying-glass search-icon"></i>
          <input type="search" class="glass-input search-input" id="user-search"
            placeholder="Search by name, email or role…" />
        </div>
        <div class="filter-sort">
          <select class="glass-input" id="user-role-filter">
            <option value="all">All Roles</option>
            <option value="admin">Administrator</option>
            <option value="officer">Field Officer</option>
            <option value="analyst">Analyst</option>
          </select>
        </div>
      </div>

      <!-- User List -->
      <div class="glass-card users-card fade-in fade-in-delay-2">
        <div style="overflow-x:auto">
          <table class="glass-table user-table">
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Status</th>
                <th>Last Login</th>
                <th style="text-align: right">Actions</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <!-- JS rendered -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Add User Modal -->
  <div class="modal-overlay hidden" id="modal-user" role="dialog" aria-modal="true">
    <div class="modal-box glass-card">
      <div class="modal-header">
        <h2 class="section-title"><span class="dot"></span> Add New User</h2>
        <button class="modal-close" id="modal-close-user"><i class="ph ph-x"></i></button>
      </div>
      <form class="report-form" id="user-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="u-name">Full Name</label>
          <input class="glass-input" id="u-name" type="text" placeholder="e.g. Ahmad Faizal" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="u-email">Email Address</label>
          <input class="glass-input" id="u-email" type="email" placeholder="e.g. ahmad@mybahaya.gov.my" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="u-role">System Role</label>
            <select class="glass-input" id="u-role" required>
              <option value="">Select role…</option>
              <option value="admin">Administrator</option>
              <option value="officer">Field Officer</option>
              <option value="analyst">Analyst</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="u-pass">Temporary Password</label>
            <input class="glass-input" id="u-pass" type="password" placeholder="••••••••" required />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-glass" id="modal-cancel-user">Cancel</button>
          <button type="submit" class="btn btn-primary">Create User <i class="ph ph-check"></i></button>
        </div>
      </form>
    </div>
  </div>

  <div class="fab-container">
    <div class="fab-menu" id="fab-menu" role="menu">
      <button class="fab-menu-item danger" id="fab-logout" role="menuitem">
        <i class="ph ph-sign-out"></i> Log Out
      </button>
    </div>
    <button class="fab-btn" id="fab-btn" aria-label="Open menu">
      <i class="ph ph-list"></i>
    </button>
  </div>

  <script src="../js/shared.js"></script>
  <script src="../js/users.js"></script>
</body>

</html>
