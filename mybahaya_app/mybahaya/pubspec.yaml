name: mybahaya
description: "MyBahaya - Community Safety App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^0.9.2
  adaptive_platform_ui: ^0.1.0
  google_fonts: ^6.2.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.0.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.0+3
  glass_liquid_navbar: ^0.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/auth/
    - assets/images/home/
    - assets/images/map/
    - assets/images/reports/
    - assets/images/alerts/
    - assets/images/settings/
    - assets/images/common/